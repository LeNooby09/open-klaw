services:
  open-klaw:
    build:
      context: .
      args:
        # Match container UID/GID to host user for bind-mount permissions.
        # Override with: OPENKLAW_UID=$(id -u) OPENKLAW_GID=$(id -g) docker compose up
        OPENKLAW_UID: ${OPENKLAW_UID:-1000}
        OPENKLAW_GID: ${OPENKLAW_GID:-1000}
    container_name: open-klaw
    # Use host networking so the container can reach host services (e.g. Ollama on localhost)
    # This is required on Linux where host.docker.internal doesn't route to 127.0.0.1
    network_mode: host
    volumes:
      # Persist workspace and conversation data between restarts
      # Also bind-mount to host directories for easy inspection
      - ./agent-workspace:/workspace
      - ./agent-data:/data
      # Bind-mount config file so edits on host are reflected in container
      - ./config.yaml:/workspace/config.yaml
    environment:
      - OPENKLAW_SANDBOXED=true
      - OPENKLAW_PORT=8080
      - OPENKLAW_BIND=0.0.0.0
      - OPENKLAW_FILE_BASE_DIR=/workspace
      # Pass API keys from host environment
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENKLAW_HOST_NETWORK=true
    # Allow container to reach host services (e.g. Ollama) via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Security: drop all capabilities, add back only what's needed
    cap_drop:
      - ALL
    # Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    # Resource limits (enforced in standalone docker compose)
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

## Volumes are bind-mounted to ./agent-workspace and ./agent-data
## for easy host-side inspection of agent files, skills, and conversations.
