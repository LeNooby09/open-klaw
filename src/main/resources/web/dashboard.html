<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Open-Klaw Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #111;
            color: #ccc;
            font-family: monospace;
            padding: 1rem
        }

        input, select {
            background: #222;
            color: #ccc;
            border: 1px solid #444;
            padding: .4rem;
            font-family: monospace;
            font-size: .9rem
        }

        input:focus {
            outline: none;
            border-color: #58a6ff
        }

        button {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: .3rem .7rem;
            cursor: pointer;
            font-family: monospace;
            font-size: .85rem
        }

        button:hover {
            background: #444
        }

        button.danger {
            color: #f66
        }

        button.primary {
            color: #58a6ff
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: .5rem
        }

        th, td {
            padding: .3rem .5rem;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: .85rem
        }

        th {
            color: #888;
            font-weight: normal;
            text-transform: uppercase;
            font-size: .75rem
        }

        .tabs {
            display: flex;
            gap: .5rem;
            margin-bottom: 1rem
        }

        .tabs button {
            border: none;
            border-bottom: 2px solid transparent;
            background: none;
            color: #888;
            padding: .3rem .5rem
        }

        .tabs button.active {
            color: #ccc;
            border-bottom-color: #58a6ff
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .7);
            z-index: 100;
            justify-content: center;
            align-items: center
        }

        .modal-overlay.active {
            display: flex
        }

        .modal {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 1.5rem;
            max-width: 400px;
            width: 90%
        }

        .modal h3 {
            margin-bottom: .75rem;
            font-size: .95rem
        }

        .modal input {
            width: 100%;
            margin-bottom: .5rem
        }

        .modal .actions {
            display: flex;
            gap: .5rem;
            justify-content: flex-end;
            margin-top: .75rem
        }

        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: .5rem 1rem;
            font-size: .85rem;
            z-index: 200;
            border: 1px solid #444;
            background: #222
        }

        .toast.success {
            border-color: #6f6;
            color: #6f6
        }

        .toast.error {
            border-color: #f66;
            color: #f66
        }

        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh
        }

        #loginBox {
            border: 1px solid #444;
            padding: 2rem;
            width: 300px
        }

        #loginBox h1 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #888
        }

        #loginBox input {
            width: 100%;
            margin-bottom: .5rem
        }

        #loginBox button {
            width: 100%;
            margin-top: .5rem
        }

        h2 {
            font-size: 1rem;
            color: #888;
            margin-bottom: .5rem
        }

        .stats {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem
        }

        .stats span {
            color: #888;
            font-size: .85rem
        }

        .stats strong {
            color: #ccc
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: .5rem;
            border-bottom: 1px solid #333
        }

        .header span {
            font-size: .85rem
        }

        #chatArea {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 16rem);
            min-height: 300px
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: .5rem;
            border: 1px solid #333;
            margin-bottom: .5rem;
            background: #0a0a0a
        }

        .msg {
            margin-bottom: .75rem;
            font-size: .85rem;
            line-height: 1.4
        }

        .msg .role {
            font-weight: bold;
            margin-bottom: .2rem
        }

        .msg.user .role {
            color: #58a6ff
        }

        .msg.assistant .role {
            color: #6f6
        }

        .msg.system .role {
            color: #888
        }

        .msg .content {
            white-space: pre-wrap;
            word-break: break-word
        }

        .msg .meta {
            color: #555;
            font-size: .7rem;
            margin-top: .2rem
        }

        #chatInput {
            display: flex;
            gap: .5rem
        }

        #chatInput input {
            flex: 1
        }

        #chatInput button {
            white-space: nowrap
        }

        .panel {
            display: none
        }

        .panel.active {
            display: block
        }

        .section {
            margin-bottom: 1.5rem
        }
    </style>
</head>
<body>

<div id="setupScreen" style="display:none">
    <div id="loginScreen" style="min-height:100vh;display:flex;justify-content:center;align-items:center">
        <div id="loginBox">
            <h1>Open-Klaw — First-Time Setup</h1>
            <div id="setupError" style="color:#f66;font-size:.85rem;margin-bottom:.5rem"></div>
            <input id="setupToken" placeholder="Signup Token" autocomplete="off">
            <input id="setupUser" placeholder="Admin Username" autocomplete="username">
            <input id="setupPass" type="password" placeholder="Password (min 8 chars)" autocomplete="new-password">
            <button onclick="doSignup()">Create Admin Account</button>
        </div>
    </div>
</div>

<div id="loginScreenWrap">
    <div id="loginScreen" style="min-height:100vh;display:flex;justify-content:center;align-items:center">
        <div id="loginBox">
            <h1>Open-Klaw</h1>
            <div id="loginError" style="color:#f66;font-size:.85rem;margin-bottom:.5rem"></div>
            <input id="loginUser" placeholder="Username" autocomplete="username"
                   onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
            <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">Login</button>
        </div>
    </div>
</div>

<div id="dashboard" style="display:none">
    <div class="header">
        <span>Open-Klaw — <strong id="headerUser"></strong> <span id="headerAdmin"></span></span>
        <div>
            <button onclick="showChangePassword()">Change Password</button>
            <button onclick="doLogout()">Logout</button>
        </div>
    </div>

    <div class="stats" id="statsBar"></div>

    <div id="adminContent" style="display:none">
        <div class="tabs" id="tabBar">
            <button class="active" onclick="switchTab('chat')">Chat</button>
            <button onclick="switchTab('conversations')">Conversations</button>
            <button onclick="switchTab('users')">Users</button>
        </div>
    </div>

    <div id="regularContent" style="display:none">
        <p style="color:#888;font-size:.85rem;margin-bottom:1rem">You are logged in as a regular user. Only basic stats
            and chat are available. Contact an admin for full dashboard access.</p>
    </div>

    <div id="panel-chat" class="panel active">
        <div id="chatArea">
            <div id="chatMessages"></div>
            <div id="chatInput">
                <input id="msgInput" placeholder="Type a message…"
                       onkeydown="if(event.key==='Enter')sendMessage()">
                <button class="primary" onclick="sendMessage()">Send</button>
                <button onclick="newConversation()">New</button>
            </div>
        </div>
    </div>

    <div id="panel-conversations" class="panel">
        <div class="section">
            <h2>Conversations</h2>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Messages</th>
                    <th>Created</th>
                    <th>Last Active</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="convTable"></tbody>
            </table>
        </div>
    </div>

    <div id="panel-users" class="panel">
        <div class="section">
            <h2>User Management</h2>
            <div style="margin-bottom:1rem">
                <button class="primary" onclick="showCreateUser()">+ Create User</button>
            </div>
            <table>
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Admin</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="usersTable"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContent"></div>
</div>

<script>
    let username = localStorage.getItem('username');
    let isAdmin = localStorage.getItem('isAdmin') === 'true';
    let currentSessionId = '';
    let statsInterval;

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML
    }

    function escAttr(s) {
        return JSON.stringify(String(s)).slice(1, -1);
    }

    function getCookie(name) {
        const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
    }

    async function api(method, url, body) {
        const o = {method, headers: {}, credentials: 'same-origin'};
        const csrf = getCookie('csrf_token');
        if (csrf && (method === 'POST' || method === 'PUT' || method === 'DELETE')) {
            o.headers['X-CSRF-Token'] = csrf;
        }
        if (body) {
            o.headers['Content-Type'] = 'application/json';
            o.body = JSON.stringify(body)
        }
        return fetch(url, o);
    }

    function toast(msg, type) {
        const t = document.createElement('div');
        t.className = 'toast ' + (type || 'success');
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function hideAll() {
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('loginScreenWrap').style.display = 'none';
        document.getElementById('dashboard').style.display = 'none';
        if (statsInterval) clearInterval(statsInterval);
    }

    function showSetup() {
        hideAll();
        document.getElementById('setupScreen').style.display = 'block';
    }

    function showLogin() {
        hideAll();
        document.getElementById('loginScreenWrap').style.display = 'block';
    }

    function showDashboard() {
        hideAll();
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('headerUser').textContent = username;
        document.getElementById('headerAdmin').textContent = isAdmin ? '(admin)' : '';
        if (isAdmin) {
            document.getElementById('adminContent').style.display = 'block';
            document.getElementById('regularContent').style.display = 'none';
        } else {
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('regularContent').style.display = 'block';
        }
        loadStats();
        statsInterval = setInterval(loadStats, 30000);
    }

    async function doSignup() {
        const t = document.getElementById('setupToken').value;
        const u = document.getElementById('setupUser').value;
        const p = document.getElementById('setupPass').value;
        if (!t || !u || !p) {
            document.getElementById('setupError').textContent = 'All fields are required.';
            return;
        }
        const r = await fetch('/api/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p, signupToken: t})
        });
        if (r.ok) {
            const d = await r.json();
            username = d.username;
            isAdmin = d.isAdmin;
            localStorage.setItem('username', username);
            localStorage.setItem('isAdmin', String(isAdmin));
            showDashboard();
        } else {
            const e = await r.json();
            document.getElementById('setupError').textContent = e.error || 'Signup failed.';
        }
    }

    async function doLogin() {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;
        const r = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });
        if (r.ok) {
            const d = await r.json();
            username = d.username;
            isAdmin = d.isAdmin;
            localStorage.setItem('username', username);
            localStorage.setItem('isAdmin', String(isAdmin));
            showDashboard();
        } else {
            const e = await r.json();
            document.getElementById('loginError').textContent = e.error || 'Login failed.';
        }
    }

    async function doLogout() {
        await api('POST', '/api/logout');
        username = null;
        isAdmin = false;
        localStorage.removeItem('username');
        localStorage.removeItem('isAdmin');
        showLogin();
    }

    async function loadStats() {
        const r = await api('GET', '/api/stats');
        if (!r.ok) {
            if (r.status === 401) {
                showLogin()
            }
            return
        }
        const s = await r.json();
        document.getElementById('statsBar').innerHTML =
            '<span>Users: <strong>' + s.totalUsers + '</strong></span>' +
            '<span>Sessions: <strong>' + s.activeSessions + '</strong></span>' +
            '<span>Conversations: <strong>' + s.activeConversations + '</strong></span>' +
            '<span>Models: <strong>' + s.configuredModels + '</strong></span>' +
            '<span>Uptime: <strong>' + formatUptime(s.uptimeSeconds) + '</strong></span>';
    }

    function formatUptime(s) {
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        return h + 'h ' + m + 'm';
    }

    function switchTab(name) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.getElementById('panel-' + name).classList.add('active');
        event.target.classList.add('active');
        if (name === 'conversations') loadConversations();
        if (name === 'users') loadUsers();
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const msg = input.value.trim();
        if (!msg) return;
        input.value = '';
        appendMessage('user', msg);
        const r = await api('POST', '/api/chat', {message: msg, sessionId: currentSessionId});
        if (r.ok) {
            const d = await r.json();
            currentSessionId = d.sessionId;
            appendMessage('assistant', d.message.content, d.message.model, d.message.provider);
        } else {
            const e = await r.json().catch(() => ({error: 'Request failed'}));
            appendMessage('system', e.error || 'Error sending message.');
        }
    }

    function appendMessage(role, content, model, provider) {
        const el = document.createElement('div');
        el.className = 'msg ' + role;
        let meta = '';
        if (model && provider) meta = '<div class="meta">' + esc(provider) + ' / ' + esc(model) + '</div>';
        el.innerHTML = '<div class="role">' + esc(role) + '</div><div class="content">' + esc(content) + '</div>' + meta;
        const mc = document.getElementById('chatMessages');
        mc.appendChild(el);
        mc.scrollTop = mc.scrollHeight;
    }

    function newConversation() {
        currentSessionId = '';
        document.getElementById('chatMessages').innerHTML = '';
        toast('New conversation started.');
    }

    async function loadConversations() {
        const r = await api('GET', '/api/conversations');
        if (!r.ok) return;
        const list = await r.json();
        const tb = document.getElementById('convTable');
        if (!list.length) {
            tb.innerHTML = '<tr><td colspan="6" style="color:#888">No conversations.</td></tr>';
            return
        }
        tb.innerHTML = '';
        list.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td style="font-size:.75rem">' + esc(c.id.substring(0, 8)) + '…</td>' +
                '<td><strong>' + esc(c.username) + '</strong></td>' +
                '<td>' + parseInt(c.messageCount) + '</td>' +
                '<td>' + new Date(c.createdAt).toLocaleString() + '</td>' +
                '<td>' + new Date(c.lastActiveAt).toLocaleString() + '</td>' +
                '<td></td>';
            const btn = document.createElement('button');
            btn.className = 'danger';
            btn.textContent = 'Delete';
            btn.addEventListener('click', () => deleteConv(c.id));
            tr.lastElementChild.appendChild(btn);
            tb.appendChild(tr);
        });
    }

    async function deleteConv(id) {
        if (!confirm('Delete this conversation?')) return;
        const r = await api('DELETE', '/api/conversations/' + encodeURIComponent(id));
        if (r.ok) {
            toast('Conversation deleted.');
            loadConversations()
        } else {
            const e = await r.json();
            toast(e.error || 'Failed.', 'error')
        }
    }

    async function loadUsers() {
        const r = await api('GET', '/api/users');
        if (!r.ok) return;
        const list = await r.json();
        const tb = document.getElementById('usersTable');
        if (!list.length) {
            tb.innerHTML = '<tr><td colspan="4" style="color:#888">No users.</td></tr>';
            return
        }
        tb.innerHTML = '';
        list.forEach(u => {
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td><strong>' + esc(u.username) + '</strong></td>' +
                '<td>' + (u.isAdmin ? 'Yes' : 'No') + '</td>' +
                '<td>' + new Date(u.createdAt).toLocaleString() + '</td>' +
                '<td></td>';
            if (u.username !== username) {
                const btn = document.createElement('button');
                btn.className = 'danger';
                btn.textContent = 'Delete';
                btn.addEventListener('click', () => deleteUser(u.username));
                tr.lastElementChild.appendChild(btn);
            } else {
                tr.lastElementChild.innerHTML = '<span style="color:#555">—</span>';
            }
            tb.appendChild(tr);
        });
    }

    function showCreateUser() {
        document.getElementById('modalContent').innerHTML =
            '<h3>Create User</h3>' +
            '<input id="newUserName" placeholder="Username">' +
            '<input id="newUserPass" type="password" placeholder="Password (min 8 chars)">' +
            '<label style="display:flex;align-items:center;gap:.5rem;margin-top:.5rem;font-size:.85rem;color:#888"><input type="checkbox" id="newUserAdmin"> Admin</label>' +
            '<div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="createUser()">Create</button></div>';
        document.getElementById('modalOverlay').classList.add('active');
    }

    async function createUser() {
        const u = document.getElementById('newUserName').value;
        const p = document.getElementById('newUserPass').value;
        const a = document.getElementById('newUserAdmin').checked;
        if (!u || !p) { toast('Username and password required.', 'error'); return; }
        const r = await api('POST', '/api/users', {username: u, password: p, isAdmin: a});
        if (r.ok) {
            toast('User created.');
            closeModal();
            loadUsers();
        } else {
            const e = await r.json();
            toast(e.error || 'Failed.', 'error');
        }
    }

    async function deleteUser(u) {
        if (!confirm('Delete user "' + u + '"?')) return;
        const r = await api('DELETE', '/api/users/' + encodeURIComponent(u));
        if (r.ok) {
            toast('User deleted.');
            loadUsers();
        } else {
            const e = await r.json();
            toast(e.error || 'Failed.', 'error');
        }
    }

    function showChangePassword() {
        document.getElementById('modalContent').innerHTML =
            '<h3>Change Password</h3>' +
            '<input id="cpCurrent" type="password" placeholder="Current Password">' +
            '<input id="cpNew" type="password" placeholder="New Password (min 8 chars)">' +
            '<div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="changePassword()">Change</button></div>';
        document.getElementById('modalOverlay').classList.add('active');
    }

    async function changePassword() {
        const cur = document.getElementById('cpCurrent').value;
        const np = document.getElementById('cpNew').value;
        if (!cur || !np) { toast('Both fields required.', 'error'); return; }
        const r = await api('POST', '/api/change-password', {currentPassword: cur, newPassword: np});
        if (r.ok) {
            toast('Password changed. Logging out…');
            closeModal();
            setTimeout(doLogout, 1500);
        } else {
            const e = await r.json();
            toast(e.error || 'Failed.', 'error');
        }
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active')
    }

    (async function init() {
        const setupCheck = await fetch('/api/setup-required');
        if (setupCheck.ok) {
            const d = await setupCheck.json();
            if (d.message === 'true') {
                showSetup();
                return;
            }
        }

        const r = await api('GET', '/api/me');
        if (r.ok) {
            const d = await r.json();
            username = d.username;
            isAdmin = d.isAdmin;
            localStorage.setItem('isAdmin', String(isAdmin));
            showDashboard();
        } else {
            localStorage.removeItem('username');
            localStorage.removeItem('isAdmin');
            showLogin();
        }
    })();
</script>
</body>
</html>
